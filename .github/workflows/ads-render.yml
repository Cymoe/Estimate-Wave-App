name: Draw the ads

# The ad maker (Ops → Ads) writes and voices an ad, then leaves it waiting.
# This draws every waiting ad with Remotion (ads-video/) and hands the files
# back to the deployment named by the CONVEX_DEPLOY_KEY secret.
#
# Started by the app when it holds a token for it (ADS_RENDER_TOKEN on the
# deployment), by hand from the Actions tab, or every few minutes by the timer
# in ads-render-timer.yml (on the default branch, where GitHub keeps timers).
# A timed run asks the backend first and stops at once when nothing waits, so
# an ad asked for with "make an ad for…" is drawn without anyone starting it. A push that changes the
# renderer draws one made-up ad instead and keeps the file with the run, to
# show the renderer still works; it leaves the waiting ads alone. (That push
# run is also what makes the workflow startable from this branch.)

on:
  workflow_dispatch:
    inputs:
      timed:
        description: Started by the timer; stop at once if nothing waits
        type: boolean
        default: false
  push:
    branches: [fieldquote-convex]
    paths:
      - 'ads-video/**'
      - '.github/workflows/ads-render.yml'

# One at a time, and never behind a deploy: a second start waits its turn and
# then draws whatever came in meanwhile.
concurrency:
  group: ads-render
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check deploy key
        if: github.event_name != 'push'
        env:
          RAW_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          # Accept a key pasted with its "|" URL-encoded as %7C.
          key="${RAW_KEY//%7C/|}"
          key="${key//%7c/|}"
          [ -n "$key" ] || { echo "::error::Add a CONVEX_DEPLOY_KEY repository secret."; exit 1; }
          # Mask every form of the key before anything else can print it.
          echo "::add-mask::$key"
          echo "::add-mask::${key#*|}"
          echo "CONVEX_DEPLOY_KEY=$key" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ads-video/package-lock.json

      - name: Install the app (for the calls to the backend)
        if: github.event_name != 'push'
        run: npm ci --no-audit --no-fund

      # A timed run stops here when nothing waits to be drawn, before the renderer and its browser are fetched.
      - name: Anything waiting?
        id: waiting
        if: github.event_name == 'workflow_dispatch' && inputs.timed
        working-directory: apps/web
        run: |
          n=$(npx convex run ads:waitingCount '{}' | tr -dc '0-9')
          echo "Waiting to be drawn: ${n:-0}"
          echo "n=${n:-0}" >> "$GITHUB_OUTPUT"

      - name: Install the renderer
        if: github.event_name == 'push' || !inputs.timed || steps.waiting.outputs.n != '0'
        working-directory: ads-video
        run: npm ci --no-audit --no-fund

      - name: What the renderer's browser needs
        if: github.event_name == 'push' || !inputs.timed || steps.waiting.outputs.n != '0'
        # The runner already carries most of these for its own Chrome; a name that isn't there is passed over.
        run: |
          sudo apt-get update -qq || true
          for pkg in libnss3 libdbus-1-3 libatk1.0-0 libgbm1 libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2 libasound2t64; do
            sudo apt-get install -y -qq "$pkg" >/dev/null 2>&1 || echo "skipped $pkg"
          done

      # Job site videos are also drawn with Tesseract, to compare (ads-video/scripts/tesseract.mjs). A software
      # Vulkan driver stands in for a GPU, the runner's FFmpeg writes the MP4, Inter is the font. The CLI is pinned
      # and checked against its published checksum. If any of this fails, only the Tesseract copies fail.
      - name: Tesseract (for the job site video test)
        if: github.event_name == 'push' || !inputs.timed || steps.waiting.outputs.n != '0'
        continue-on-error: true
        env:
          TSRCT_VERSION: 0.8.0
          TSRCT_SHA256: ec64c9b4b6eebda8e685697b16f62f8c85283d99062d50af6000fd7bfc32a311
        run: |
          sudo apt-get install -y -qq mesa-vulkan-drivers libvulkan1 fonts-inter ffmpeg >/dev/null
          zip="tesseract-${TSRCT_VERSION}-linux-x86_64.zip"
          curl -sSLf -o "$RUNNER_TEMP/$zip" "https://github.com/mirage-hq/tesseract/releases/download/v${TSRCT_VERSION}/${zip}"
          echo "${TSRCT_SHA256}  $RUNNER_TEMP/$zip" | sha256sum -c -
          unzip -q -o "$RUNNER_TEMP/$zip" -d "$RUNNER_TEMP/tesseract-bundle"
          bash "$RUNNER_TEMP/tesseract-bundle/tesseract-${TSRCT_VERSION}-linux-x86_64/install.sh" "$RUNNER_TEMP/tesseract"
          "$RUNNER_TEMP/tesseract/bin/tsrct" telemetry disable
          echo "TSRCT=$RUNNER_TEMP/tesseract/bin/tsrct" >> "$GITHUB_ENV"
          echo "FFMPEG=$(command -v ffmpeg)" >> "$GITHUB_ENV"

      - name: Get the renderer's browser
        if: github.event_name == 'push' || !inputs.timed || steps.waiting.outputs.n != '0'
        working-directory: ads-video
        run: npx remotion browser ensure

      - name: Draw what's waiting
        if: github.event_name == 'workflow_dispatch' && (!inputs.timed || steps.waiting.outputs.n != '0')
        working-directory: ads-video
        run: node scripts/render-queue.mjs

      - name: Draw the made-up ad
        if: github.event_name == 'push'
        working-directory: ads-video
        run: node scripts/render-queue.mjs --fixture fixtures/check.json --out out/check

      # A made-up job site video drawn with Tesseract, from a test pattern made here: shows the Tesseract path works.
      - name: Draw a made-up job site video with Tesseract
        if: github.event_name == 'push'
        continue-on-error: true
        working-directory: ads-video
        run: |
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "testsrc2=s=1920x1080:d=6:r=30" -f lavfi -i "sine=frequency=330:duration=6" -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest fixtures/clip.mp4
          node scripts/render-queue.mjs --fixture fixtures/tesseract.json --out out/check

      - name: Keep the made-up ad with the run
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: check-ad
          path: ads-video/out/check/*.mp4
          retention-days: 7
