name: Draw waiting ads (watcher)

# The ad maker lives on fieldquote-convex; its renderer (ads-render.yml) only
# starts when something starts it. This watcher asks the backend once a minute
# whether any ad waits to be drawn and, when one does and no drawing is under
# way, starts the renderer. An ad asked for with "make an ad for…" is drawn
# within a minute or two of its voice, with nobody starting anything.
#
# A run watches for a little under six hours (GitHub's limit for a job) and
# then starts the next one, so the watch never stops. The timer below is only a
# backstop that restarts it if a hand-off is ever missed; GitHub runs timers
# late, and only from the default branch, which is why this file is on main.

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

# One watcher at a time; the next waits for this one to finish.
concurrency:
  group: ads-render-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Check deploy key
        env:
          RAW_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          # Accept a key pasted with its "|" URL-encoded as %7C.
          key="${RAW_KEY//%7C/|}"
          key="${key//%7c/|}"
          [ -n "$key" ] || { echo "::error::Add a CONVEX_DEPLOY_KEY repository secret."; exit 1; }
          echo "::add-mask::$key"
          echo "::add-mask::${key#*|}"
          echo "CONVEX_DEPLOY_KEY=$key" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: fieldquote-convex

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install the app (for the calls to the backend)
        run: npm ci --no-audit --no-fund

      - name: Watch for ads waiting to be drawn
        working-directory: apps/web
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          end=$(( $(date +%s) + 340 * 60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            # A failed check is passed over, never the end of the watch.
            n=$(npx convex run ads:waitingCount '{}' 2>/dev/null | tr -dc '0-9' || true)
            if [ "${n:-0}" != "0" ]; then
              busy=$(gh run list --repo "${{ github.repository }}" --workflow ads-render.yml --limit 5 --json status --jq '[.[] | select(.status != "completed")] | length' || echo 1)
              if [ "${busy:-0}" = "0" ]; then
                echo "$(date -u +%H:%M) ${n} waiting: starting the renderer"
                gh workflow run ads-render.yml --repo "${{ github.repository }}" --ref fieldquote-convex -f timed=true || true
              fi
            fi
            sleep 60
          done

      # Only after a full watch: a run that fails at once (no key) must not start the next one straight away.
      - name: Hand over to the next watcher
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ads-render-timer.yml --repo "${{ github.repository }}" --ref main
